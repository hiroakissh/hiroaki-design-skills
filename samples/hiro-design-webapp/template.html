<div class="workspace"><aside class="sidebar"><strong><span class="brand-mark" aria-hidden="true"></span>Workspace</strong><p class="muted" style="font-size:12px;margin-top:8px">個人のプロジェクト</p><nav aria-label="ワークスペース"><a href="#projects" aria-current="page">プロジェクト</a><a href="#demo-note">デモについて</a></nav></aside>
<section class="workspace-content" id="projects"><div class="page-heading"><div><p class="section-label">取り組みを見渡す</p><h1>プロジェクト</h1><p>状況を比べて、次に進めるものを選ぶ。</p></div><button class="primary" data-open-dialog>プロジェクトを追加</button></div><dl class="stats"><div><dt>すべて</dt><dd class="number" id="all-project-count">{{project_count}}</dd></div><div><dt>進行中</dt><dd class="number">{{active_count}}</dd></div><div><dt>確認待ち</dt><dd class="number">{{review_count}}</dd></div></dl>
<div class="filters"><label class="field">プロジェクト名<input id="project-search" type="search" placeholder="名前で検索" autocomplete="off"></label><label class="field">状態<select id="status-filter"><option value="all">すべて</option><option>進行中</option><option>検討中</option><option>確認待ち</option><option>未着手</option></select></label><button id="clear-filters">条件を解除</button></div>
<div class="table-tools"><span id="result-count" aria-live="polite">{{project_count}}件</span><div class="row"><span id="selection-count" class="muted" aria-live="polite">0件を選択中</span><button id="clear-selection" disabled>選択を解除</button></div></div>
<div class="table-scroll" role="region" aria-label="プロジェクトの一覧。狭い画面では横にスクロールできます" tabindex="0"><table><thead><tr><th><label class="row"><input type="checkbox" id="select-all" aria-label="表示中のすべてを選択">プロジェクト</label></th><th>種類</th><th>状態</th><th class="num">進捗</th></tr></thead><tbody id="project-rows">{{table_rows}}</tbody></table></div>
<div id="no-results" class="state-box" hidden><h2>条件に合うプロジェクトがありません</h2><p>検索語を変えるか、「条件を解除」を選んでください。</p></div><p class="live-message" id="webapp-message" aria-live="polite"></p><p id="demo-note" class="muted" style="font-size:12px;margin-top:18px">架空のデータを使ったデモです。検索・絞り込み・選択・追加を操作できます。再読み込みで初期状態に戻ります。</p></section></div>
<dialog aria-labelledby="project-dialog-title"><form id="project-form"><h2 id="project-dialog-title">プロジェクトを追加</h2><label>プロジェクト名<input name="project" required maxlength="80" autocomplete="off"></label><div class="dialog-actions"><button type="button" data-close-dialog>キャンセル</button><button class="primary" type="submit">追加する</button></div></form></dialog>
