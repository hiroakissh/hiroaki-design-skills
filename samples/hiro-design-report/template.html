<article class="report"><header><p class="section-label">比較レポート / 表示確認用</p><h1>{{title}}</h1><p class="muted">{{subtitle}}</p></header><hr class="divider"><section><h2 style="font-size:17px">要約</h2><p class="summary">この架空の条件では、案Aが完了率と時間で優位。</p><p class="muted" style="font-size:14px">実際の採用判断には、対象者と測定条件をそろえた追加検証が必要です。</p></section><div class="report-grid"><section><h2>タスク完了率</h2><figure class="bar-figure"><svg viewBox="0 0 360 205" role="img" aria-labelledby="chart-title chart-description"><title id="chart-title">3案のタスク完了率</title><desc id="chart-description">案A90%、案B75%、案C65%。0を起点に比較。架空データです。</desc>{{chart_bars}}<text x="60" y="195" class="axis-label">0</text><text x="280" y="195" text-anchor="end" class="axis-label">100%</text></svg><figcaption class="muted" style="font-size:12px">棒の長さは0〜100%の同じ尺度です。</figcaption></figure></section><section><h2>同じ条件で比較する</h2><table><thead><tr><th>案</th><th class="num">完了率</th><th class="num">所要時間</th></tr></thead><tbody>{{comparison_rows}}</tbody></table><p class="muted" style="font-size:12px;margin-top:14px">時間は秒、率は%で統一しています。</p></section></div><section class="report-notes"><h2>根拠と制約</h2><p>{{source}}</p><p>実在する調査の結果ではありません。対象者数・調査日・測定方法を設定していないため、実際の優劣は判断できません。実レポートでは出典と条件を記載します。</p></section></article>
